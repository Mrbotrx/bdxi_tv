name: AKASH KB TEAM

on:

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akash-kb-team
  cancel-in-progress: true


jobs:

  generate:

    runs-on: ubuntu-latest

    steps:

      # ----------------------------------------------------
      # Checkout
      # ----------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

        with:
          fetch-depth: 0


      # ----------------------------------------------------
      # Python
      # ----------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.12"


      # ----------------------------------------------------
      # Install
      # ----------------------------------------------------

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests


      # ----------------------------------------------------
      # Generate
      # ----------------------------------------------------

      - name: Generate AKASH playlist
        run: |
          python akash_api-pro.py


      # ----------------------------------------------------
      # Validate
      # ----------------------------------------------------

      - name: Validate M3U
        run: |

          test -s akash_DTH.m3u

          grep -q "#EXTM3U" akash_DTH.m3u

          echo "Playlist validation successful."

          echo "Channel count:"
          grep -c "^#EXTINF" akash_DTH.m3u || true


      # ----------------------------------------------------
      # Git
      # ----------------------------------------------------

      - name: Commit and Push
        run: |

          git config user.name "KB IPTV Bot"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add akash_DTH.m3u akash_DTH.json

          if git diff --cached --quiet; then

            echo "No changes."

          else

            git commit \
              -m "Auto update AKASH KB playlist"

            git pull --rebase origin main

            git push

          fi
